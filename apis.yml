aid: lightbend
name: Lightbend
type: Index
description: >-
  Lightbend, Inc. (dba Akka) is the company behind the Akka agentic systems platform. Founded as Typesafe by the
  creators of the Scala language and the Akka actor toolkit, the company built the JVM reactive stack — Akka actors,
  Akka Streams, Akka HTTP, Akka gRPC, Akka Cluster and Play Framework — before pivoting to a full-stack platform for
  production agentic AI and rebranding to Akka. The current product line covers the Akka SDK (agents, orchestration,
  memory, streaming, HTTP/gRPC/MCP endpoints), Akka Automated Operations for multi-region deployment and operations,
  an in-runtime governance and policy-enforcement engine aligned to the EU AI Act, and Akka Specify, a delivered
  spec-driven path onto the same platform. lightbend.com now redirects to akka.io; the JVM library API surface is
  catalogued separately in the api-evangelist akka repository.
