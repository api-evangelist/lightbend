notes: Lightbend (dba Akka) ships a first-party MCP server as a subcommand of the Akka CLI. `akka mcp
  serve` exposes Akka CLI operations as MCP tools over stdio for IDE / desktop MCP clients. It is marked
  "[Incubating]" in the CLI reference. Separately, the Akka SDK lets developers author their own MCP endpoints
  in their services (`@McpEndpoint`), served over stateless Streamable HTTP at `/mcp`.
server:
  name: akka
  transport: stdio
  command: akka
  args:
  - mcp
  - serve
  docs: https://doc.akka.io/reference/cli/akka-cli/akka_mcp_serve.html
client_config:
  claude_desktop: '{ "mcpServers": { "akka": { "command": "akka", "args": ["mcp", "serve"] } } }

    '
  verified_clients:
